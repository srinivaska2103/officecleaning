        <circle cx="50" cy="30" r="4" fill="#FFFFFF" class="animate-ping" />

        <!-- Cleaning bristles / lines -->
        <line x1="25" y1="75" x2="35" y2="65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
        <line x1="75" y1="75" x2="65" y2="65" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Error message text -->

    <!-- Actions -->

        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Return to Safety</span>

      <a href="contact.html" class="w-full bg-slate-50 dark:bg-slate-900 text-slate-650 dark:text-slate-300 font-bold py-3 px-6 rounded-xl hover:bg-slate-100 transition-all text-sm border border-slate-150 dark:border-slate-800">
